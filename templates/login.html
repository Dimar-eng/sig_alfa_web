<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | SIG-ALFA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white shadow-xl rounded-3xl border border-slate-100 p-8 text-center">
        
        <div class="bg-indigo-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-md">
            
        </div>

        <h2 class="text-2xl font-extrabold text-slate-900 mb-1">Acceso Administrativo</h2>
        <p class="text-xs text-slate-500 mb-6">Ingresa la clave para acceder al Banco de Datos</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="bg-rose-50 text-rose-600 text-sm font-semibold p-3 rounded-xl mb-4 border border-rose-100">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <input type="password" name="password" required placeholder="Contraseña de Administrador" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-center">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition">
                Ingresar al Panel
            </button>
        </form>

        <a href="/" class="inline-block mt-6 text-xs text-slate-400 hover:text-slate-600 transition">← Regresar al sitio público</a>

    </div>

</body>
</html>
