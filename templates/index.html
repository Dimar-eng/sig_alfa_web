<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-ALFA - Evaluación Sensorial</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">SIG-ALFA</h1>
            <p class="text-slate-600 mt-2">Sistema de Evaluación y Seguimiento Sensorial</p>
        </div>

        <!-- BLOQUE PARA MOSTRAR MENSAJES DE ALERTA O DUPLICADOS -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-6 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm font-medium shadow-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/guardar" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Nombre del Paciente -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre del Paciente</label>
                    <input type="text" name="nombre_paciente" placeholder="Cocardo Pérez" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Identificación -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Identificación (T.I. / C.C.)</label>
                    <input type="text" name="identificacion" placeholder="10********" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Edad -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Edad</label>
                    <input type="number" name="edad" placeholder="25" required min="1" max="120" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Condición / Diagnóstico -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Condición</label>
                    <select name="condicion" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Seleccione una opción...</option>
                        <option value="TDAH">TDAH</option>
                        <option value="Autismo">Autismo (TEA)</option>
                        <option value="Síndrome de Down">Síndrome de Down</option>
                        <option value="Desarrollo Típico">Desarrollo Típico</option>
                    </select>
                </div>

                <!-- Kit Utilizado -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kit Sensorial Utilizado</label>
                    <select name="kit_utilizado" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Seleccione un kit...</option>
                        <option value="Kit Táctil de Alta Textura">Kit Táctil de Alta Textura</option>
                        <option value="Kit Auditivo y Visual Suave">Kit Auditivo y Visual Suave</option>
                        <option value="Kit Motriz Fina y Formas">Kit Motriz Fina y Formas</option>
                        <option value="Kit Dinámico Integral">Kit Dinámico Integral</option>
                    </select>
                </div>

                <!-- Nivel de Atención -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nivel de Atención Observado</label>
                    <select name="nivel_atencion" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Seleccione nivel...</option>
                        <option value="Alto">Alto</option>
                        <option value="Medio">Medio</option>
                        <option value="Bajo">Bajo</option>
                    </select>
                </div>

                <!-- Adulto Responsable -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Adulto Responsable</label>
                    <input type="text" name="adulto_responsable" placeholder="Cocardo Pérez (Él mismo)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Teléfono -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono de Contacto</label>
                    <input type="tel" name="telefono" placeholder="310********" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Contacto de Emergencia -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contacto de Emergencia</label>
                    <input type="text" name="contacto_emergencia" placeholder="Cereza Pérez - 311********" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" name="email" placeholder="coquito.perez@ejemplo.com" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <!-- Observaciones -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Observaciones</label>
                <textarea name="observaciones" rows="3" placeholder="El paciente mostró excelente receptividad al kit táctil..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md">
                    Registrar Evaluación Sensorial
                </button>
            </div>
        </form>
        
        <div class="text-center mt-6">
            <a href="/login" class="text-sm text-indigo-600 hover:underline">Acceso Administrativo</a>
        </div>
    </div>
</body>
</html>
